[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/get-events"
  to = "/.netlify/functions/get-events"
  status = 200

[[redirects]]
  from = "/api/submit-order"
  to = "/.netlify/functions/submit-order"
  status = 200

[[redirects]]
  from = "/api/get-catalog"
  to = "/.netlify/functions/get-catalog"
  status = 200

# SPA fallback — serves index.html for any unmatched path (client-side routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
