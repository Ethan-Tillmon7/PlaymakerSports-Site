[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Live endpoints. Paths are also listed in shared/api.ts (client side).
[[redirects]]
  from = "/api/get-events"
  to = "/.netlify/functions/get-events"
  status = 200

[[redirects]]
  from = "/api/submit-contact"
  to = "/.netlify/functions/submit-contact"
  status = 200

# Legacy (parked) endpoints — no caller in src/; see src/legacy/jersey-orders/README.md.
[[redirects]]
  from = "/api/submit-order"
  to = "/.netlify/functions/submit-order"
  status = 200

[[redirects]]
  from = "/api/get-catalog"
  to = "/.netlify/functions/get-catalog"
  status = 200

[[redirects]]
  from = "/api/submit-purchase"
  to = "/.netlify/functions/submit-purchase"
  status = 200

# SPA fallback. Every public route is prerendered to a real file, so only
# /customizer needs a rewrite. It gets the empty app shell (scripts/prerender.ts),
# not index.html: that file is the prerendered homepage, and hydrating another
# route against it throws and flashes the homepage.
#
# There's deliberately no "/*" catch-all. Netlify serves dist/404.html (the same
# empty shell) with a real 404 status for any unknown path, and React renders
# NotFoundPage. A "/*" rule with status 404 also swallows Vite's module requests
# (/src/*, /@vite/*) under `netlify dev`, and the app never boots.
[[redirects]]
  from = "/customizer"
  to = "/app.html"
  status = 200

# ── Caching ──
# Everything in /assets/ is content-hashed by Vite (JS, CSS, fonts, images), so a
# changed file always gets a new URL. Let browsers keep these for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Security headers ──
# script-src keeps 'unsafe-inline' on purpose: browsers apply script-src to
# <script type="application/ld+json">, and dropping it silently kills the JSON-LD
# structured data on every page. style-src needs it too — the pages use inline
# style={{...}} props for scroll/parallax transforms. Tightening either to a
# nonce or hash requires build-pipeline changes, not just a header edit.
# img-src allows any https host because catalog image URLs come from the
# Google Sheet and are not restricted to a known CDN.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
